name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log || {
            # 실패 원인을 주석(annotation)으로 남겨 API로 읽을 수 있게
            grep -E "^e: |error:|What went wrong|Could not|requires|> " build.log | grep -v "> Task" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk PhoneCCTV-v1.0.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Claude CCTV v1.0.${{ github.run_number }}
          files: PhoneCCTV-v1.0.${{ github.run_number }}.apk
          make_latest: true
